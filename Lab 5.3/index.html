<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="description" content="Data Visualisation Exercise 1" />
    <meta name="keywords" content="HTML, CSS" />
    <meta name="author" content="Your name here" />

    <title>Task 5.3 D3 Adding and Removing Data</title>
    <!--Insert description of exercise  -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        button {
            border: none;
            color: white;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 10px 5px;
            cursor: pointer;
            border-radius: 5px;
            transition-duration: 0.4s;
        }

        #add {
            background-color: #4CAF50;
        } 

        #add:hover {
            background-color: #45a049;
        }

        #remove {
            background-color: #2196F3;
           
        }

        #remove:hover {
            background-color: #0b7dda;
        }

        svg {
            margin-top: 20px;
        }
    </style>


</head>

<body>
    <h1>Add and Removing Values</h1>
    <button id="add">Add</button>
    <button id="remove">Remove</button>
    <br>

    <script>
        // example from Murray
        var dataset = [20, 5, 26, 23, 9, 23, 16, 4, 29];
        var w = 500;
        var h = 150;
        var padding = 1;
        var maxValue = 25;



        var xScale = d3.scaleBand()
            .domain(d3.range(dataset.length))
            .rangeRound([0, w])
            .paddingInner(0.05);

        var yScale = d3.scaleLinear()
            .domain([0, d3.max(dataset, function (d) {
                return d;
            })])   // The data input range
            .range([0, 150]);    // The range available for visualization on screen

        var svg1 = d3.select("body")
            .append("svg")
            .attr("width", w)
            .attr("height", h);

        //initial bars
        svg1.selectAll("rect")
            .data(dataset)
            .enter()
            .append("rect")
            .attr("x", function (d, i) {
                return xScale(i);
            })
            .attr("y", function (d) {
                return h - yScale(d);
            })
            .attr("width", xScale.bandwidth())
            .attr("height", function (d) {
                return yScale(d);
            })
            .attr("fill", "teal")


        //initial text
        svg1.selectAll("text")
            .data(dataset)
            .enter()
            .append("text")
            .text(function (d) {
                return d;
            })
            .attr("x", function (d, i) { return xScale(i) + xScale.bandwidth() / 2; })
            .attr("y", function (d) {
                return h - yScale(d) + 14;
            })
            .attr("fill", "white")
            .attr("font-family", "sans-serif")
            .attr("text-anchor", "middle")
        


        function updateChart() {
            xScale.domain(d3.range(dataset.length))

            // Update the Y scale based on new data
            yScale.domain([0, d3.max(dataset)]);

            var bars = svg1.selectAll("rect")
                .data(dataset);

            //update bars
            bars.enter()
                .append("rect")
                .attr("x", w)
                .attr("y", function (d) {
                    return h - yScale(d);
                })
                .attr("fill", "teal")
                .merge(bars)
                .transition()
                .duration(500)
                .attr("x", function (d, i) {
                    return xScale(i);
                })
                .attr("y", function (d) {
                    return h - yScale(d);
                })
                .attr("width", xScale.bandwidth())
                .attr("height", function (d) {
                    return yScale(d);
                });
            
            // Exit bars
            bars.exit()
                .transition()
                .duration(500)
                .attr("x", w)
                .remove();

            // Update text labels
            var labels = svg1.selectAll("text")
                .data(dataset);

            labels.enter()
                .append("text")
                .text(function (d) {
                    return d;
                })
                .attr("x", w)
                .attr("y", function (d) {
                    return h - yScale(d) + 14;
                })
                .attr("fill", "white")
                .attr("font-family", "sans-serif")
                .attr("text-anchor", "middle")
                .merge(labels)
                .transition()
                .duration(500)
                .attr("x", function (d, i) {
                    return xScale(i) + xScale.bandwidth() / 2;
                })
                .attr("y", function (d) {
                    return h - yScale(d) + 14;
                })
                .text(function (d) {
                    return d;
                });

            // Exit labels
            labels.exit().transition()
                .duration(500).remove();
        }

        // Add new data button
        d3.select("#add").on("click", function () {
           
            var newNumber = Math.floor(Math.random() * maxValue);
            dataset.push(newNumber);
            updateChart();            
        });

        // Remove data button
        d3.select("#remove").on("click", function () {
            dataset.shift();
            updateChart();
        });

    </script>


    <br><br>
    <footer style="color:grey">COS30045 Data Visualisation<br>Joe Bloggs</footer>

</body>



</html>
